# Phase 2 - ASR pipeline configuration.
# This file contains only YAML config values for the Whisper ASR stage.

data_dir: data
results_dir: results
log_dir: logs
seed: 42

ingestion:
  max_duration_s: 300
  min_duration_s: 1.0
  audio_sample_rate: 16000
  force_cfr: true
  vfr_tolerance: 0.02
  random_frame_checks: 20
  black_frame_mean: 8.0
  max_bad_frame_fraction: 0.1
  x264_crf: 18
  x264_preset: veryfast

gates:
  frame_count_rel_diff: 0.01
  audio_video_diff_s: 0.1
  decode_errors: 0

asr:
  backend: faster-whisper
  model_size: small
  language: en
  device: cpu
  compute_type: int8
  vad_filter: true
  beam_size: 5
  condition_on_previous_text: true

  max_no_speech_prob: 0.5
  min_avg_logprob: -1.0

  hallucination_phrases:
    - thank you for watching
    - subscribe
    - like and subscribe

  max_words: 18
  max_duration_s: 12.0
  split_gap_s: 1.0

  min_duration_s: 0.7
  merge_gap_s: 0.2
  merge_max_words: 24

  timestamp_match_min_ratio: 0.5
  nonspeech_overlap_ratio: 0.2

asr_gates:
  wer_max: 0.35
  start_mae_s_max: 0.75
  hallucination_rate_max: 0.2
# Phase 1 + Phase 2 settings (ingestion, then speech recognition).
# Every threshold lives here; nothing is hard-coded in src.

data_dir: data
results_dir: results
log_dir: logs
seed: 42

# ============================================================
# PHASE 1 - VIDEO INGESTION
# ============================================================

ingestion:
  max_duration_s: 300        # Development cap; 0 = no limit
  min_duration_s: 1.0        # Reject clips shorter than this
  audio_sample_rate: 16000   # Whisper / pyannote expect 16 kHz mono

  force_cfr: true            # Re-encode variable frame rate to constant frame rate
  vfr_tolerance: 0.02       # Relative gap between r_frame_rate and avg_frame_rate

  random_frame_checks: 20    # Number of random seek-and-read checks
  black_frame_mean: 8.0      # Mean pixel value below which frame counts as black
  max_bad_frame_fraction: 0.1

  x264_crf: 18               # Quality when re-encoding is needed
  x264_preset: veryfast


# ============================================================
# PHASE 1 - VIDEO INGESTION GATES
# ============================================================

gates:
  frame_count_rel_diff: 0.01 # OpenCV vs ffprobe frame count
  audio_video_diff_s: 0.1    # |audio duration - video duration|
  decode_errors: 0            # FFmpeg null-decode error lines


# ============================================================
# PHASE 2 - AUTOMATIC SPEECH RECOGNITION
# ============================================================

asr:

  # ----------------------------------------------------------
  # Whisper backend
  # ----------------------------------------------------------

  backend: faster-whisper     # faster-whisper | openai-whisper

  model_size: small           # tiny | base | small | medium | large-v3

  language: en                # null = automatic language detection

  device: auto                # auto | cpu | cuda

  compute_type: auto          # auto | int8 | float16 | float32
                              # Used by faster-whisper

  vad_filter: true            # Silero VAD; suppresses silence hallucinations

  beam_size: 5

  condition_on_previous_text: false
                              # False reduces repetition loops
                              # and runaway hallucination


  # ----------------------------------------------------------
  # Hallucination / low-confidence filtering
  # ----------------------------------------------------------

  max_no_speech_prob: 0.6

  min_avg_logprob: -1.0

  hallucination_phrases:
    - thanks for watching
    - thank you for watching
    - please subscribe
    - subtitles by
    - amara.org
    - like and subscribe


  # ----------------------------------------------------------
  # Balloon-sized segmentation
  # ----------------------------------------------------------

  max_words: 12
  # Maximum number of words in one dialogue balloon

  max_duration_s: 4.0
  # Maximum duration of one dialogue segment

  split_gap_s: 0.8
  # Split when there is a pause of at least 0.8 seconds

  min_duration_s: 0.5
  # Fragments shorter than this may be merged

  merge_gap_s: 0.5
  # Maximum gap allowed when merging fragments

  merge_max_words: 16
  # Maximum words allowed after merging


  # ----------------------------------------------------------
  # Evaluation
  # ----------------------------------------------------------

  timestamp_match_min_ratio: 0.5
  # Minimum text similarity for matching manual timestamp marks

  nonspeech_overlap_ratio: 0.5
  # Segment is considered hallucination if >= 50%
  # overlaps manually marked non-speech


# ============================================================
# PHASE 2 - ASR GATES
# ============================================================

asr_gates:

  wer_max: 0.15
  # Word Error Rate <= 15%

  start_mae_s_max: 0.5
  # Start timestamp Mean Absolute Error <= 0.5 seconds

  hallucination_rate_max: 0.05
  # Hallucination rate <= 5%